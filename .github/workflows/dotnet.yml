name: build-and-test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OpenMono.sln

      # Directory.Build.props sets TreatWarningsAsErrors=true, so this also
      # fails the build on any new compiler/analyzer warning.
      - name: Build
        run: dotnet build OpenMono.sln --no-restore --configuration Debug

      - name: Test
        run: dotnet test OpenMono.sln --no-build --configuration Debug --verbosity normal
